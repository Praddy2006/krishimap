<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>KrishiMap — Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/auth-theme.css" />
</head>
<body>

<header class="topbar">
  <div class="wordmark">Krishi<span class="accent-italic">Map</span></div>
</header>

<main class="hero">
  <div class="hero-copy">
    <h1>Know your <em>soil.</em></h1>
    <p class="sub">State-wise soil, crop, and climate data for India. Log in to pick up where you left off.</p>
    <svg class="sprout" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 118V60" stroke="#15171a" stroke-width="4" stroke-linecap="round"/>
      <path d="M50 62C50 62 20 55 20 25C20 25 55 20 50 62Z" fill="#F6851B"/>
      <path d="M50 70C50 70 80 60 80 30C80 30 45 28 50 70Z" fill="#15171a"/>
    </svg>
  </div>

  <div class="auth-card">
    <h2>Log in</h2>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" required />

      <button type="submit" class="btn-primary">Log in</button>
    </form>

    <div id="msg"></div>

    <div class="switch-link">
      New here? <a href="register.html">Create an account</a>
    </div>
  </div>
</main>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  msg.className = ''; msg.textContent = '';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (!res.ok) {
      msg.className = 'error';
      msg.textContent = data.error || 'Login failed.';
      return;
    }

    window.location.href = 'map.html';
  } catch (err) {
    msg.className = 'error';
    msg.textContent = 'Could not reach the server. Is it running?';
  }
});
</script>
</body>
</html>
